name: Publish relay image to GHCR

# Builds the Mesh relay container image from source (Dockerfile in this repo) and pushes
# it to the GitHub Container Registry. Runs when a release is published, when source
# changes on main, or on demand with an optional version tag.

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Dockerfile"
      - ".github/workflows/publish-image.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Optional version to publish alongside latest (for example 1.11.1)"
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Compute lowercase image name
        id: img
        run: echo "image=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/relay" >> "$GITHUB_OUTPUT"

      - name: Compute tags
        id: tags
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          VERSION="$RELEASE_TAG"
          if [ -z "$VERSION" ]; then
            VERSION="$REQUESTED_VERSION"
          fi
          VERSION="${VERSION#v}"

          if [ -n "$VERSION" ]; then
            if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid version '$VERSION'; expected X.Y.Z." >&2
              exit 1
            fi
            echo "list=${{ steps.img.outputs.image }}:latest,${{ steps.img.outputs.image }}:${VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "list=${{ steps.img.outputs.image }}:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.title=Mesh Relay
            org.opencontainers.image.description=Self-hosted Mesh relay. Routes end-to-end-encrypted messages; never sees their contents.
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
